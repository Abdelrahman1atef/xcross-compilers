# Builds, verifies and publishes the iOS compilers for one Flutter release.
#
# Run it by hand (Actions > build > Run workflow), with
#   gh workflow run build.yml -f flutter=3.47.8
# or by pushing a tag named after the Flutter version (git tag 3.47.8).
#
# 1. resolve: Flutter version -> engine, Dart revision, Dart version.
# 2. reference (macOS): Flutter's own compiler on a real `flutter build ios`.
# 3. build: the compiler for every host and mode, from the Dart sources.
# 4. verify: each built compiler must write the same bytes as Flutter's.
# 5. publish: a release named after the Flutter version, with the zips and
#    manifest.json (only the compilers that were verified).
name: build
run-name: build ${{ github.event.inputs.flutter || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      flutter:
        description: Flutter version, such as 3.47.8
        required: true
      publish:
        description: Publish the release
        type: boolean
        default: true
      reference_from:
        description: Reuse the macOS reference of this earlier run of the same Flutter version (optional)
        default: ''
      hosts:
        description: "all (default) or linux (only the Linux compilers)"
        default: all
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.event.inputs.flutter || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      flutter: ${{ steps.resolve.outputs.flutter }}
      engine: ${{ steps.resolve.outputs.engine }}
      dart: ${{ steps.resolve.outputs.dart }}
      dart_version: ${{ steps.resolve.outputs.dart_version }}
      sdk_hash: ${{ steps.resolve.outputs.sdk_hash }}
      compressed_pointers: ${{ steps.resolve.outputs.compressed_pointers }}
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
      - id: hosts
        # `linux` builds only the Linux compilers; the default builds all four hosts.
        env:
          HOSTS: ${{ github.event.inputs.hosts }}
        run: |
          linux='{"name":"linux-x64","runner":"ubuntu-24.04"},{"name":"linux-arm64","runner":"ubuntu-24.04-arm"}'
          windows='{"name":"windows-x64","runner":"windows-2022"},{"name":"windows-arm64","runner":"windows-11-arm"}'
          if [ "$HOSTS" = "linux" ]; then echo "hosts=[$linux]" >> "$GITHUB_OUTPUT"
          else echo "hosts=[$linux,$windows]" >> "$GITHUB_OUTPUT"; fi
      - id: resolve
        run: python3 tool/resolve.py "${{ github.event.inputs.flutter || github.ref_name }}" --github-output "$GITHUB_OUTPUT"

  reference:
    needs: resolve
    # Flutter's own output for a version never changes: an earlier run's
    # reference can stand in when macOS runners are short.
    if: ${{ github.event.inputs.reference_from == '' || github.event.inputs.reference_from == null }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        mode: [release, profile]
    steps:
      - uses: actions/checkout@v4
      - run: bash tool/reference.sh "${{ needs.resolve.outputs.flutter }}" "${{ matrix.mode }}" ref
      - uses: actions/upload-artifact@v4
        with:
          name: reference-${{ matrix.mode }}
          path: |
            ref/app.dill
            ref/command.json
            ref/official.json
            ref/official-version.txt
            ref/official/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-log-${{ matrix.mode }}
          path: ref/build.log
          if-no-files-found: ignore

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        mode: [release, profile]
        host: ${{ fromJSON(needs.resolve.outputs.hosts) }}
    runs-on: ${{ matrix.host.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Dart before 3.3 imports `imp`, which Python 3.12 removed.
          python-version: '3.11'
      - name: Install ninja
        # Older Dart does not check ninja out; the newer ones use their own.
        run: python -m pip install ninja
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Fetch the Dart SDK
        run: python tool/fetch.py --dart "${{ needs.resolve.outputs.dart }}" --work "${{ runner.temp }}/work"
      - name: Build gen_snapshot
        run: >
          python tool/build.py
          --sdk "${{ runner.temp }}/work/dart/sdk"
          --mode "${{ matrix.mode }}"
          --sdk-hash "${{ needs.resolve.outputs.sdk_hash }}"
          --dart-version "${{ needs.resolve.outputs.dart_version }}"
          --compressed-pointers "${{ needs.resolve.outputs.compressed_pointers }}"
          --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.mode }}-${{ matrix.host.name }}
          path: dist/

  verify:
    needs: [resolve, reference, build]
    # Every compiler that built is verified, even when another build failed
    # (its leg fails at the download). Publishing still needs all eight.
    if: ${{ !cancelled() && (needs.reference.result == 'success' || (needs.reference.result == 'skipped' && github.event.inputs.reference_from != '')) }}
    strategy:
      fail-fast: false
      matrix:
        mode: [release, profile]
        host: ${{ fromJSON(needs.resolve.outputs.hosts) }}
    runs-on: ${{ matrix.host.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reference-${{ matrix.mode }}
          path: ref
          run-id: ${{ github.event.inputs.reference_from || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: compiler-${{ matrix.mode }}-${{ matrix.host.name }}
          path: dist
      - name: Unpack
        run: |
          mkdir compiler
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('compiler')" dist/gen_snapshot-${{ matrix.mode }}-${{ matrix.host.name }}.zip
          chmod +x compiler/gen_snapshot* || true
      - name: Same bytes as Flutter's compiler
        run: >
          python tool/verify.py
          --compiler compiler/gen_snapshot${{ runner.os == 'Windows' && '.exe' || '' }}
          --reference ref
          --record dist/build-${{ matrix.mode }}-${{ matrix.host.name }}.json
          --keep built
      - uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.mode }}-${{ matrix.host.name }}
          path: dist/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mismatch-${{ matrix.mode }}-${{ matrix.host.name }}
          path: built/
          if-no-files-found: ignore

  publish:
    needs: [resolve, verify]
    # Without !cancelled(), a reused reference (the reference job skipped)
    # skips this job too. A verify leg that failed does not stop the others
    # from being published: only the compilers that matched Flutter's byte for
    # byte are in the release (a host needs release and profile).
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'failure') && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-*
          path: verified
          merge-multiple: true
      - name: Write manifest.json
        run: >
          python3 tool/manifest.py --complete-hosts-only
          --flutter "$VERSION"
          --engine "${{ needs.resolve.outputs.engine }}"
          --dart "${{ needs.resolve.outputs.dart }}"
          --builds verified --out verified/manifest.json
      - name: Publish the release
        run: |
          # Upload only what the manifest lists (the hosts that passed).
          zips=$(python3 -c "import json; print(' '.join('verified/' + n for n in json.load(open('verified/manifest.json'))['assets']))")
          hosts=$(python3 -c "import json; print(', '.join(sorted({n.rsplit('-', 2)[-2] + '-' + n.rsplit('-', 1)[-1][:-4] for n in json.load(open('verified/manifest.json'))['assets']})))")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists; replacing its files (manifest last)."
            gh release upload "$VERSION" $zips --clobber
            gh release upload "$VERSION" verified/manifest.json --clobber
          else
            # Only the highest Flutter version is "Latest": older versions
            # published later (the backfill) must not take that label.
            newest=$( (gh release list --limit 1000 --json tagName --jq '.[].tagName'; echo "$VERSION") \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            latest=false
            [ "$newest" = "$VERSION" ] && latest=true
            gh release create "$VERSION" --title "Flutter $VERSION" --latest="$latest" \
              --notes "iOS arm64 gen_snapshot for Flutter $VERSION (engine ${{ needs.resolve.outputs.engine }}, Dart ${{ needs.resolve.outputs.dart_version }}). Built from the Dart SDK sources; verified byte-identical to Flutter's official macOS compiler. Hosts: $hosts." \
              $zips verified/manifest.json
          fi
